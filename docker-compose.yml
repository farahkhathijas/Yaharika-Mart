version: '3.9'

services:
  mongo:
    image: mongo:7.0
    container_name: yaharika-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: yaharika-mart
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: yaharika-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - MONGO_URI=mongodb://mongo:27017/yaharika-mart
      - NODE_ENV=development
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_min32_characters_here}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_refresh_secret_min32chars}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-placeholder}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-placeholder}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-placeholder}
    volumes:
      - ./apps/api/src:/app/src
      - ./packages/shared-types:/shared-types
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: yaharika-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
      - NODE_ENV=development
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
